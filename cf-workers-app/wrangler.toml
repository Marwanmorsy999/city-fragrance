name = "cf-workers-app"
main = "src/main.tsx"
compatibility_date = "2026-01-01"

[vars]
ENVIRONMENT = "development"

[env.production]
name = "cf-workers-app-production"

[[hyperdrive]]
binding = "DATABASE"
id = "REPLACE_WITH_HYPERDRIVE_ID"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"
